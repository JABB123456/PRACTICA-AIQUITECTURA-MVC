<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}Finanzas Personales{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header>
    <h1><a href="{{ url_for('movimientos.index') }}">Finanzas Personales</a></h1>
  </header>
  <main>
    {% with mensajes = get_flashed_messages(with_categories=true) %}
      {% if mensajes %}
        <ul class="flashes">
          {% for categoria, mensaje in mensajes %}
            <li class="flash flash-{{ categoria }}">{{ mensaje }}</li>
          {% endfor %}
        </ul>
      {% endif %}
    {% endwith %}
    {% block contenido %}{% endblock %}
  </main>
  <footer>
    <p>El ahorro es lo único que te dará riqueza</p>
  </footer>
</body>
</html>
